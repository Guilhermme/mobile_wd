name: Mobile Automation CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project structure
        run: |
          test -f package.json
          test -f wdio.conf.js
          test -d test/specs
          test -d test/pageobjects
          test -d docs
          test -d app

      - name: Show available test scripts
        run: npm run